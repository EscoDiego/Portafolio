services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamtasks
      POSTGRES_USER: teamtasks
      POSTGRES_PASSWORD: teamtasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtasks -d teamtasks"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://teamtasks:teamtasks@db:5432/teamtasks
      SECRET_KEY: change-this-secret-before-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:

